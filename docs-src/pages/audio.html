<p>
        <code>Audio.playOneShot(clip, posición, volumen)</code> reproduce un sonido una vez. El clip es una ruta dentro de <code>Assets</code>.
        Con <code>posición</code> suena en 3D; con <code>nil</code> suena en 2D. Para sonidos continuos usa un <code>AudioSource</code>
        y <code>entity:playSound()</code>.
      </p>
